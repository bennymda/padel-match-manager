<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="padelGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="200" height="200" rx="44" fill="#0B0F19" />
  <rect x="6" y="6" width="188" height="188" rx="38" fill="none" stroke="url(#padelGlow)" stroke-width="4" stroke-opacity="0.5" />
  
  <!-- Padel Racket Shape -->
  <circle cx="100" cy="85" r="55" fill="#131B2E" stroke="#CCFF00" stroke-width="6" />
  <!-- Perforations / Holes -->
  <circle cx="85" cy="70" r="5" fill="#CCFF00" />
  <circle cx="100" cy="70" r="5" fill="#CCFF00" />
  <circle cx="115" cy="70" r="5" fill="#CCFF00" />
  <circle cx="75" cy="85" r="5" fill="#00D2FF" />
  <circle cx="90" cy="85" r="5" fill="#FFFFFF" />
  <circle cx="105" cy="85" r="5" fill="#FFFFFF" />
  <circle cx="120" cy="85" r="5" fill="#00D2FF" />
  <circle cx="85" cy="100" r="5" fill="#CCFF00" />
  <circle cx="100" cy="100" r="5" fill="#CCFF00" />
  <circle cx="115" cy="100" r="5" fill="#CCFF00" />
  
  <!-- Handle -->
  <rect x="92" y="136" width="16" height="42" rx="6" fill="#1E293B" stroke="#00D2FF" stroke-width="3" />
  <line x1="92" y1="150" x2="108" y2="150" stroke="#CCFF00" stroke-width="2" />
  <line x1="92" y1="162" x2="108" y2="162" stroke="#CCFF00" stroke-width="2" />
</svg>
